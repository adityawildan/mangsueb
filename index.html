    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" error in iframe/sandbox environments
      (function() {
        try {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { console.warn('Attempted to overwrite window.fetch'); },
            configurable: true
          });
          if (typeof globalThis !== 'undefined') {
            Object.defineProperty(globalThis, 'fetch', {
              get: function() { return originalFetch; },
              set: function(val) { console.warn('Attempted to overwrite globalThis.fetch'); },
              configurable: true
            });
          }
        } catch (e) {
          console.warn('Could not define custom fetch descriptor:', e);
        }
      })();
    </script>

      /* CUSTOM BOX LOADER CSS */
      .loader-wrapper {
          position: relative;
          width: 200px;
          height: 200px;
          -webkit-user-select: none;
          user-select: none;
      }

      .loader-wrapper .box-wrap {
          width: 70%;
          height: 70%;
          margin: 15% 15%;
          position: relative;
          transform: rotate(-45deg);
      }

      .loader-wrapper .box-wrap .box {
          width: 100%;
          height: 100%;
          position: absolute;
          left: 0;
          top: 0;
          background: linear-gradient(to right, #141562, #486FBC, #EAB5A1, #8DD6FF, #4973C9, #D07CA7, #F4915E, #F5919E, #B46F89, #141562, #486FBC);
          background-position: 0% 50%;
          background-size: 1000% 1000%;
          visibility: hidden;
          filter: drop-shadow(0 0 15px rgba(234, 181, 161, 0.2));
      }

      .loader-wrapper .box-wrap .box.one { animation: moveGradient 15s infinite, oneMove 3.5s infinite; }
      .loader-wrapper .box-wrap .box.two { animation: moveGradient 15s infinite, twoMove 3.5s .15s infinite; }
      .loader-wrapper .box-wrap .box.three { animation: moveGradient 15s infinite, threeMove 3.5s .3s infinite; }
      .loader-wrapper .box-wrap .box.four { animation: moveGradient 15s infinite, fourMove 3.5s .575s infinite; }
      .loader-wrapper .box-wrap .box.five { animation: moveGradient 15s infinite, fiveMove 3.5s .725s infinite; }
      .loader-wrapper .box-wrap .box.six { animation: moveGradient 15s infinite, sixMove 3.5s .875s infinite; }

      @keyframes moveGradient { to { background-position: 100% 50%; } }

      @keyframes oneMove {
          0% { visibility: visible; clip-path: inset(0% 35% 70% round 5%); animation-timing-function: cubic-bezier(0.86, 0, 0.07, 1); }
